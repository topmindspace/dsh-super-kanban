# Dependabot configuration — https://docs.github.com/code-security/dependabot
#
# Super Kanban has zero npm/pnpm dependencies by design (see CONTRIBUTING.md),
# so the only ecosystem worth tracking is the GitHub Actions used by CI and the
# release workflow. Updates arrive as grouped weekly pull requests and are
# validated by the existing CI jobs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    # One grouped PR keeps review noise low; cap concurrent open PRs.
    open-pull-requests-limit: 3
    # Auto-rebase so the grouped PR keeps tracking main without manual work.
    rebase-strategy: auto
    # Route the bot's PRs to the maintainer for review and merge.
    reviewers:
      - "topmindspace"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
