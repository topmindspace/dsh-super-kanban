name: Release

# Push a version tag (for example `v0.4.1`) to publish the exact package version
# to npm with provenance and create the matching GitHub Release:
#
#   git tag -a v0.4.1 -m "v0.4.1"
#   git push origin main --tags
#
# Required repository secret: NPM_TOKEN (npm automation token with publish
# rights to the `dsh-super-kanban` package). Publishing fails with a clear
# message when the secret is absent instead of silently skipping the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      - name: Check tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected). Bump the version and re-tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version."

      - name: Unit tests
        run: npm test

      - name: Repository validation
        run: npm run validate

      - name: Privacy scan
        run: npm run check:privacy

      - name: Documentation links, screenshots and structure
        run: npm run check:docs

      # Blocks a tag when package.json, CHANGELOG.md, docs/index.json, SECURITY.md
      # or the documented compatibility ranges disagree with each other.
      - name: Version, changelog and compatibility consistency
        run: npm run check:version

      - name: Ensure the plugin-market index is committed
        run: |
          if [ ! -f docs/index.json ]; then
            echo "::error::docs/index.json is missing. Run 'npm run market:index' and commit the result before tagging."
            exit 1
          fi
          node scripts/build-market-index.mjs --check

      - name: Package contents (npm pack --dry-run)
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `gh release create` writes the GitHub Release; provenance needs OIDC.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          registry-url: "https://registry.npmjs.org"

      - name: Require NPM_TOKEN secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it under Settings -> Secrets and variables -> Actions (npm automation token with publish rights for dsh-super-kanban), then re-run this workflow."
            exit 1
          fi

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish failed for dsh-super-kanban@$version. Check that NPM_TOKEN still has publish rights, that the token is not expired, and that this version is not already published on npm."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  market-index:
    name: Update market index on main
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Nice-to-have: a protected branch may reject the bot push. The release is
    # already published by now, so this job must not fail the workflow.
    continue-on-error: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      - name: Regenerate the market index for the released commit
        run: node scripts/build-market-index.mjs --source=git --commit="$GITHUB_SHA"

      - name: Commit the index to main
        run: |
          if [ -z "$(git status --porcelain docs/index.json docs/icon.svg)" ]; then
            echo "Market index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/icon.svg
          git commit -m "chore: update plugin market index for $GITHUB_REF_NAME"
          # Rebase on the latest main in case another commit landed meanwhile;
          # this job only touches docs/index.json and docs/icon.svg.
          git pull --rebase origin main
          git push origin HEAD:main
