name: Release

# Push a version tag (for example `vX.Y.Z`) to publish the exact package version
# to npm with provenance and create the matching GitHub Release:
#
#   git tag -a vX.Y.Z -m "vX.Y.Z"
#   git push --atomic origin HEAD:refs/heads/main refs/tags/vX.Y.Z
#
# Required repository secret: NPM_TOKEN (npm granular access token with publish
# rights to the `dsh-super-kanban` package). Publishing fails with a clear
# message when the secret is absent instead of silently skipping the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19"

      - name: Check tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected). Bump the version and re-tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version."

      - name: Unit tests
        run: npm test

      - name: Repository validation
        run: npm run validate

      - name: Privacy scan
        run: npm run check:privacy

      - name: Documentation links, screenshots and structure
        run: npm run check:docs

      # Blocks a tag when package.json, CHANGELOG.md, docs/index.json, SECURITY.md
      # or the documented compatibility ranges disagree with each other.
      - name: Version, changelog and compatibility consistency
        run: npm run check:version

      - name: Ensure the plugin-market index is committed
        run: |
          if [ ! -f docs/index.json ]; then
            echo "::error::docs/index.json is missing. Run 'npm run market:index' and commit the result before tagging."
            exit 1
          fi
          node scripts/build-market-index.mjs --check
          pin="$(node -p 'require("./docs/index.json").plugins[0].versions[0].source.commit || ""')"
          if [ -n "$pin" ]; then
            git merge-base --is-ancestor "$pin" HEAD
            pinned_version="$(git show "$pin:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
            test "v$pinned_version" = "$GITHUB_REF_NAME"
          fi

      - name: Package contents (npm pack --dry-run)
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `gh release create` writes the GitHub Release; provenance needs OIDC.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19"
          registry-url: "https://registry.npmjs.org"

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          if published="$(npm view "$package@$version" gitHead --json 2>"$registry_error")"; then
            if [ "$published" != "\"$commit\"" ]; then
              echo "::error::$package@$version already exists with an unverified commit. Check the registry before retrying."
              exit 1
            fi
            echo "$package@$version already points at the release commit."
            exit 0
          fi
          if ! grep -q 'E404' "$registry_error"; then
            echo "::error::Could not check whether $package@$version is already published."
            exit 1
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Configure a granular access token with publish rights, then re-run this workflow."
            exit 1
          fi
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish failed for dsh-super-kanban@$version. Check that NPM_TOKEN still has publish rights, that the token is not expired, and that this version is not already published on npm."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json url >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          test -s "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag

      # Keep the public Releases page short: only the three newest release
      # pages are kept. Tags and commits are NOT deleted, so historical version
      # pins (plugin market index) and changelog tag links keep working.
      - name: Prune old releases (keep the newest three)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "Deleting old release page $tag (tag and commit are kept)"
            gh release delete "$tag" --yes || true
          done

  market-index:
    name: Update market index on main
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Nice-to-have: a protected branch may reject the bot push. The release is
    # already published by now, so this job must not fail the workflow.
    continue-on-error: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19"

      - name: Regenerate the market index for the released commit
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "main has advanced to $expected. Keeping its market index."
            exit 0
          fi
          commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          node scripts/build-market-index.mjs --source=git --commit="$commit"

      - name: Commit the index to main
        run: |
          if [ -z "$(git status --porcelain docs/index.json docs/icon.svg)" ]; then
            echo "Market index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/icon.svg
          git commit -m "chore: update plugin market index for $GITHUB_REF_NAME"
          git push origin HEAD:main
