# Super Kanban bundle patch.
# The bundle is selected through the profile's `dsh.profile.bundles` list; this
# patch inserts the host half of the plugin. The browser half is discovered from
# package.json `dsh.client` by @deepseek-ai/dsh-client-modules.
#
# No `config:` block: the plugin never reads Cordis config. Board settings
# (autoScan / scanIntervalSeconds / AI budget, …) live in the board state and are
# edited from the settings UI (`settings.update` → state.json), so a patch-level
# config here would be dead configuration that silently does nothing.
- insert:
    - id: super-kanban
      name: "dsh-super-kanban"
